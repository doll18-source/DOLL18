<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark') {
                    document.documentElement.setAttribute('data-theme', 'dark');
                    var m = document.querySelector('meta[name="theme-color"]');
                    if (m) m.setAttribute('content', '#210d19');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffe9f2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="DOLL18">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Doll18 - Tonton</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: linear-gradient(160deg,#fff7fb 0%,#ffe9f2 50%,#fdf2f8 100%) fixed; min-height: 100vh; color: #5b2a45; padding-bottom: 40px; }

        header { position: sticky; top: 0; background-color: rgba(255,255,255,0.55); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid rgba(244,114,182,0.25); z-index: 100; }
        .logo { font-size: 1.8rem; font-weight: 900; letter-spacing: 2px; color: #db2777; text-decoration: none; display: inline-block; padding: 8px 90px 8px 14px; border-radius: 12px; line-height: 1.1; -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; background: linear-gradient(90deg, rgba(255,240,246,0.92) 0%, rgba(255,240,246,0.55) 45%, rgba(255,240,246,0) 100%), url(logo-bg.png) right center / auto 100% no-repeat; }
        .header-icons i { font-size: 1.1rem; color: #ec4899; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; }
        .header-icons a { font-size: 1.1rem; color: #ec4899; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; }

        .main-container { max-width: 900px; margin: 0 auto; padding: 12px; }
        @media (min-width: 700px) { .main-container { padding: 20px; } }
        .video-title { font-size: clamp(1.05rem, 2.5vw, 1.4rem); font-weight: bold; margin-bottom: 8px; line-height: 1.3; overflow-wrap: anywhere; }

        .player-wrapper { position: relative; width: 100%; background-color: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; aspect-ratio: 16/9; }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }

        .actions-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .action-btn-outline { background: transparent; border: 1px solid rgba(244,114,182,0.45); color: #be185d; padding: 11px 18px; border-radius: 20px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; }
        .action-btn-outline:hover { border-color: #f472b6; background-color: rgba(251,207,232,0.4); }

        .publish-info { display: flex; flex-wrap: wrap; gap: 15px; font-size: 0.8rem; color: #b0457a; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid rgba(244,114,182,0.25); }
        .publish-info span { display: flex; align-items: center; gap: 5px; }
        .notfound { text-align: center; color: #b0457a; padding: 60px 0; }
        .notfound a { color: #be185d; }

        /* ===== Mode gelap ===== */
        html[data-theme="dark"] body { background: linear-gradient(160deg,#16080f 0%,#210d19 50%,#180a12 100%) fixed; color: #f6dbe8; }
        html[data-theme="dark"] header { background-color: rgba(34,14,25,0.6); border-bottom-color: rgba(244,114,182,0.2); }
        html[data-theme="dark"] .logo { color: #f472b6; background: linear-gradient(90deg, rgba(58,22,41,0.92) 0%, rgba(58,22,41,0.55) 45%, rgba(58,22,41,0) 100%), url(logo-bg.png) right center / auto 100% no-repeat; }
        html[data-theme="dark"] .header-icons i, html[data-theme="dark"] .header-icons a { color: #f9a8d4; }
        html[data-theme="dark"] .search-container { background-color: rgba(34,14,25,0.55); border-bottom-color: rgba(244,114,182,0.2); }
        html[data-theme="dark"] .search-box, html[data-theme="dark"] input[type=text], html[data-theme="dark"] input[type=url], html[data-theme="dark"] input[type=password] { background-color: rgba(255,255,255,0.07); border-color: rgba(244,114,182,0.3); color: #f6dbe8; }
        html[data-theme="dark"] .search-box::placeholder, html[data-theme="dark"] input::placeholder { color: #a8738c; }
        html[data-theme="dark"] .video-card, html[data-theme="dark"] .box, html[data-theme="dark"] .item { background-color: rgba(255,255,255,0.06); border-color: rgba(244,114,182,0.2); box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
        html[data-theme="dark"] .thumbnail-container, html[data-theme="dark"] .preview { background-color: rgba(244,114,182,0.1); }
        html[data-theme="dark"] .video-meta, html[data-theme="dark"] .empty, html[data-theme="dark"] .publish-info { color: #c98aa9; }
        html[data-theme="dark"] .publish-info { border-bottom-color: rgba(244,114,182,0.2); }
        html[data-theme="dark"] .action-btn-outline, html[data-theme="dark"] .notfound a, html[data-theme="dark"] .btn.secondary { color: #f9a8d4; border-color: rgba(244,114,182,0.4); }
        html[data-theme="dark"] .action-btn-outline:hover, html[data-theme="dark"] .btn.secondary:hover, html[data-theme="dark"] .item button:hover { background-color: rgba(244,114,182,0.15); }
        html[data-theme="dark"] label, html[data-theme="dark"] summary { color: #e9a3c4 !important; }
        html[data-theme="dark"] h2 { color: #f9a8d4; }
        html[data-theme="dark"] .box, html[data-theme="dark"] input[type=file] { color: #e8c3d5; }
        html[data-theme="dark"] .box code { background: rgba(244,114,182,0.15); }
        html[data-theme="dark"] .msg.ok, html[data-theme="dark"] .item .new { color: #4ade80; }
        html[data-theme="dark"] .msg.err { color: #fb7185; }
        html[data-theme="dark"] .item button { color: #fb7185; border-color: rgba(244,114,182,0.3); }
        html[data-theme="dark"] a[style*="color:#db2777"] { color: #f9a8d4 !important; }
        #theme-btn { transition: transform 0.3s; }
        #theme-btn:active { transform: rotate(40deg) scale(0.9); }

        .help-box { margin-bottom: 14px; border-radius: 12px; border: 1px solid rgba(244,114,182,0.3); background: rgba(255,255,255,0.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 0.85rem; line-height: 1.55; color: #6b2145; }
        .help-box summary { cursor: pointer; padding: 12px 14px; font-weight: 600; color: #be185d; list-style: none; display: flex; align-items: center; gap: 8px; }
        .help-box summary::-webkit-details-marker { display: none; }
        .help-box summary::after { content: '\25BE'; margin-left: auto; transition: transform 0.2s; }
        .help-box[open] summary::after { transform: rotate(180deg); }
        .help-body { padding: 0 14px 14px; }
        .help-body ul { padding-left: 18px; margin: 6px 0 10px; }
        .help-body li { margin-bottom: 4px; }
        .help-body code { background: rgba(244,114,182,0.18); padding: 1px 6px; border-radius: 4px; font-size: 0.8rem; }
        .help-body .action-btn-outline { margin-top: 4px; }
        html[data-theme="dark"] .help-box { background: rgba(255,255,255,0.06); border-color: rgba(244,114,182,0.25); color: #e8c3d5; }
        html[data-theme="dark"] .help-box summary { color: #f9a8d4; }
        html[data-theme="dark"] .help-body code { background: rgba(244,114,182,0.18); }

        .genre-links { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .genre-links a { font-size: 0.8rem; font-weight: 600; padding: 5px 12px; border-radius: 14px; background: rgba(244,114,182,0.18); color: #be185d; text-decoration: none; border: 1px solid rgba(244,114,182,0.3); }
        .genre-links a:hover { background: rgba(244,114,182,0.3); }
        html[data-theme="dark"] .genre-links a { background: rgba(244,114,182,0.2); color: #f9a8d4; border-color: rgba(244,114,182,0.3); }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DOLL18</a>
        <div class="header-icons">
            <i class="fas fa-sun" id="theme-btn" title="Ganti tema"></i>
            <i class="fas fa-bars" id="menu-btn" title="Menu" role="button" aria-label="Menu"></i>
        </div>
    </header>

    <div class="main-container" id="content"></div>

    <script src="app.js"></script>
    <script>
        const content = document.getElementById('content');
        const idParam = new URLSearchParams(location.search).get('id');

        loadVideos().then(videos => {
        setMenuData(videos || [], null);
        if (videos === null) {
            content.innerHTML = '<div class="notfound">Gagal memuat data video.<br><br><a href="index.html">Kembali ke beranda</a></div>';
            return;
        }
        const video = idParam ? videos.find(v => v.id === idParam) : videos[0];

        if (!video) {
            content.innerHTML = '<div class="notfound">Video tidak ditemukan.<br><br><a href="index.html">Kembali ke beranda</a></div>';
        } else {
            document.title = video.title + ' - Doll18';

            const h1 = document.createElement('h1');
            h1.className = 'video-title';
            h1.textContent = video.title;

            const player = document.createElement('div');
            player.className = 'player-wrapper';
            const iframe = document.createElement('iframe');
            iframe.src = video.url;
            iframe.allowFullscreen = true;
            player.appendChild(iframe);

            content.append(h1, player);

            // Bantuan kalau pemutar kosong (biasanya karena diblokir provider internet)
            const help = document.createElement('details');
            help.className = 'help-box';
            help.innerHTML =
                '<summary><i class="fas fa-circle-question"></i> Video tidak muncul?</summary>' +
                '<div class="help-body">' +
                'Biasanya pemutar diblokir oleh provider internet. Coba salah satu cara ini:' +
                '<ul>' +
                '<li><strong>Android:</strong> Pengaturan &rarr; Jaringan &rarr; <strong>DNS Pribadi</strong> &rarr; isi <code>one.one.one.one</code></li>' +
                '<li><strong>iPhone / WiFi:</strong> ganti DNS ke <code>1.1.1.1</code> atau <code>8.8.8.8</code></li>' +
                '<li>Atau pakai VPN, lalu muat ulang halaman ini.</li>' +
                '</ul>' +
                '</div>';
            const body = help.querySelector('.help-body');
            if (isValidHttpUrl(video.url)) {
                const open = document.createElement('a');
                open.href = video.url;
                open.target = '_blank';
                open.rel = 'noopener';
                open.className = 'action-btn-outline';
                open.innerHTML = '<i class="fas fa-up-right-from-square"></i> Buka di tab baru';
                body.appendChild(open);
            }
            content.appendChild(help);

            const dl = getDownloadUrl(video.url);
            if (dl) {
                const bar = document.createElement('div');
                bar.className = 'actions-bar';
                const a = document.createElement('a');
                a.href = dl;
                a.target = '_blank';
                a.rel = 'noopener';
                a.className = 'action-btn-outline';
                a.innerHTML = '<i class="fas fa-download"></i> Download';
                bar.appendChild(a);
                content.appendChild(bar);
            }

            const info = document.createElement('div');
            info.className = 'publish-info';
            info.innerHTML = '<span><i class="far fa-calendar-alt"></i></span><span><i class="far fa-clock"></i></span>';
            info.children[0].append(' ' + formatDate(video.createdAt));
            info.children[1].append(' ' + formatTime(video.createdAt));
            content.appendChild(info);

            const gs = videoGenres(video);
            if (gs.length) {
                const gl = document.createElement('div');
                gl.className = 'genre-links';
                gs.forEach(g => {
                    const a = document.createElement('a');
                    a.href = 'index.html?genre=' + encodeURIComponent(g);
                    a.textContent = g;
                    gl.appendChild(a);
                });
                content.insertBefore(gl, info);
            }
        }
        });
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
        }
    </script>
</body>
</html>
