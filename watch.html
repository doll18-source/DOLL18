<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doll18 - Tonton</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #050505; color: #fff; padding-bottom: 40px; }

        header { position: sticky; top: 0; background-color: #0d0d0d; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1f1f1f; z-index: 100; }
        .logo { font-size: 1.1rem; font-weight: bold; color: #fff; text-decoration: none; }
        .header-icons a { font-size: 1.1rem; color: #ccc; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; }

        .main-container { max-width: 900px; margin: 0 auto; padding: 12px; }
        @media (min-width: 700px) { .main-container { padding: 20px; } }
        .video-title { font-size: clamp(1.05rem, 2.5vw, 1.4rem); font-weight: bold; margin-bottom: 8px; line-height: 1.3; overflow-wrap: anywhere; }

        .player-wrapper { position: relative; width: 100%; background-color: #000; border-radius: 8px; overflow: hidden; margin-bottom: 12px; aspect-ratio: 16/9; }
        .player-wrapper iframe { width: 100%; height: 100%; border: none; }

        .actions-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .action-btn-outline { background: transparent; border: 1px solid #333; color: #fff; padding: 11px 18px; border-radius: 20px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; text-decoration: none; }
        .action-btn-outline:hover { border-color: #555; background-color: #111; }

        .publish-info { display: flex; flex-wrap: wrap; gap: 15px; font-size: 0.8rem; color: #888; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #1a1a1a; }
        .publish-info span { display: flex; align-items: center; gap: 5px; }
        .notfound { text-align: center; color: #888; padding: 60px 0; }
        .notfound a { color: #ccc; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DOLL18</a>
        <div class="header-icons">
            <a href="upload.html" title="Upload Video"><i class="fas fa-upload"></i></a>
        </div>
    </header>

    <div class="main-container" id="content"></div>

    <script src="app.js"></script>
    <script>
        const content = document.getElementById('content');
        const idParam = new URLSearchParams(location.search).get('id');

        loadVideos().then(videos => {
        if (videos === null) {
            content.innerHTML = '<div class="notfound">Gagal memuat data video.<br><br><a href="index.html">Kembali ke beranda</a></div>';
            return;
        }
        const video = idParam ? videos.find(v => v.id === idParam) : videos[0];

        if (!video) {
            content.innerHTML = '<div class="notfound">Video tidak ditemukan.<br><br><a href="index.html">Kembali ke beranda</a></div>';
        } else {
            document.title = video.title + ' - Doll18';

            const h1 = document.createElement('h1');
            h1.className = 'video-title';
            h1.textContent = video.title;

            const player = document.createElement('div');
            player.className = 'player-wrapper';
            const iframe = document.createElement('iframe');
            iframe.src = video.url;
            iframe.allowFullscreen = true;
            player.appendChild(iframe);

            content.append(h1, player);

            const dl = getDownloadUrl(video.url);
            if (dl) {
                const bar = document.createElement('div');
                bar.className = 'actions-bar';
                const a = document.createElement('a');
                a.href = dl;
                a.target = '_blank';
                a.rel = 'noopener';
                a.className = 'action-btn-outline';
                a.innerHTML = '<i class="fas fa-download"></i> Download';
                bar.appendChild(a);
                content.appendChild(bar);
            }

            const info = document.createElement('div');
            info.className = 'publish-info';
            info.innerHTML = '<span><i class="far fa-calendar-alt"></i></span><span><i class="far fa-clock"></i></span>';
            info.children[0].append(' ' + formatDate(video.createdAt));
            info.children[1].append(' ' + formatTime(video.createdAt));
            content.appendChild(info);
        }
        });
    </script>
</body>
</html>
