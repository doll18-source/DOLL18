<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doll18 - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #050505; color: #fff; padding-bottom: 30px; }

        header { position: sticky; top: 0; background-color: #0d0d0d; display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #1f1f1f; z-index: 100; }
        .logo { font-size: 1.1rem; font-weight: bold; color: #fff; text-decoration: none; }
        .header-icons { display: flex; align-items: center; gap: 4px; }
        .header-icons i, .header-icons a { font-size: 1.1rem; color: #ccc; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; }

        .search-container { padding: 10px 16px; background-color: #0d0d0d; display: none; border-bottom: 1px solid #1f1f1f; }
        .search-container.active { display: block; }
        .search-box { width: 100%; padding: 8px 14px; border-radius: 20px; border: 1px solid #333; background-color: #1a1a1a; color: #fff; outline: none; font-size: 1rem; }

        .video-feed { max-width: 1100px; margin: 0 auto; padding: 12px; display: grid; grid-template-columns: 1fr; gap: 14px; }
        @media (min-width: 600px) { .video-feed { grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 16px; } }
        @media (min-width: 900px) { .video-feed { grid-template-columns: repeat(3, 1fr); } }
        .empty { grid-column: 1 / -1; }
        .video-card { background-color: #121212; border-radius: 8px; overflow: hidden; border: 1px solid #1f1f1f; text-decoration: none; color: inherit; display: block; transition: transform 0.2s; }
        .video-card:active { transform: scale(0.98); }
        .thumbnail-container { position: relative; width: 100%; aspect-ratio: 16/9; background-color: #1a1a1a; display: flex; align-items: center; justify-content: center; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        .play-icon-overlay { position: absolute; font-size: 2.5rem; color: rgba(255,255,255,0.8); pointer-events: none; }
        .video-title { padding: 10px 12px 4px; font-size: 0.95rem; font-weight: bold; line-height: 1.3; }
        .video-meta { padding: 6px 12px 10px; font-size: 0.8rem; color: #888; }
        .meta-item { display: flex; align-items: center; gap: 5px; }
        .empty { text-align: center; color: #888; padding: 40px 0; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DOLL18</a>
        <div class="header-icons">
            <a href="upload.html" title="Upload Video"><i class="fas fa-upload"></i></a>
            <i class="fas fa-search" id="search-btn"></i>
        </div>
    </header>

    <div class="search-container" id="search-bar">
        <input type="text" class="search-box" id="search-input" placeholder="Cari video...">
    </div>

    <div class="video-feed" id="video-list"></div>

    <script src="app.js"></script>
    <script>
        const listEl = document.getElementById('video-list');
        const searchInput = document.getElementById('search-input');
        let VIDEOS = [];

        document.getElementById('search-btn').addEventListener('click', () => {
            document.getElementById('search-bar').classList.toggle('active');
            searchInput.focus();
        });

        function render(filter = '') {
            listEl.innerHTML = '';
            const q = filter.trim().toLowerCase();
            if (VIDEOS === null) {
                const e = document.createElement('div');
                e.className = 'empty';
                e.textContent = 'Gagal memuat daftar video. Pastikan videos.json ada dan web dibuka lewat server/GitHub Pages.';
                listEl.appendChild(e);
                return;
            }
            const videos = VIDEOS.filter(v => v.title.toLowerCase().includes(q));

            if (!videos.length) {
                const e = document.createElement('div');
                e.className = 'empty';
                e.textContent = 'Video tidak ditemukan.';
                listEl.appendChild(e);
                return;
            }

            videos.forEach(v => {
                const a = document.createElement('a');
                a.className = 'video-card';
                a.href = 'watch.html?id=' + encodeURIComponent(v.id);

                const thumb = document.createElement('div');
                thumb.className = 'thumbnail-container';
                const img = document.createElement('img');
                img.src = v.thumb;
                img.alt = v.title;
                img.loading = 'lazy';
                const play = document.createElement('i');
                play.className = 'far fa-play-circle play-icon-overlay';
                thumb.append(img, play);

                const title = document.createElement('div');
                title.className = 'video-title';
                title.textContent = v.title;

                const meta = document.createElement('div');
                meta.className = 'video-meta';
                const item = document.createElement('div');
                item.className = 'meta-item';
                item.innerHTML = '<i class="far fa-clock"></i>';
                item.append(' ' + formatDate(v.createdAt));
                meta.appendChild(item);

                a.append(thumb, title, meta);
                listEl.appendChild(a);
            });
        }

        searchInput.addEventListener('input', e => render(e.target.value));
        loadVideos().then(v => { VIDEOS = v; render(searchInput.value); });
    </script>
</body>
</html>
