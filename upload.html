<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doll18 - Upload Video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #050505; color: #fff; padding-bottom: 40px; }

        header { position: sticky; top: 0; background-color: #0d0d0d; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #1f1f1f; z-index: 100; }
        .logo { font-size: 1.1rem; font-weight: bold; color: #fff; text-decoration: none; }

        .container { max-width: 600px; margin: 0 auto; padding: 16px 12px; }
        @media (min-width: 700px) { .container { padding: 24px 16px; } }
        h1 { font-size: 1.1rem; margin-bottom: 16px; }
        h2 { font-size: 0.95rem; margin: 28px 0 10px; color: #ccc; }

        label { display: block; font-size: 0.85rem; color: #aaa; margin: 14px 0 6px; }
        input[type=text], input[type=url] { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #333; background-color: #1a1a1a; color: #fff; font-size: 1rem; outline: none; }
        input:focus { border-color: #666; }
        input[type=file] { width: 100%; font-size: 0.85rem; color: #ccc; }

        .preview { margin-top: 10px; width: 100%; aspect-ratio: 16/9; background: #121212; border: 1px dashed #333; border-radius: 8px; display: none; object-fit: cover; }
        .preview.show { display: block; }

        .btn { margin-top: 20px; width: 100%; background: #fff; color: #000; border: none; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
        .btn:hover { background: #ddd; }
        .btn.secondary { background: transparent; color: #fff; border: 1px solid #333; margin-top: 8px; font-weight: normal; }
        .btn.secondary:hover { background: #111; }
        .msg { margin-top: 12px; font-size: 0.85rem; min-height: 1.2em; }
        .msg.ok { color: #4ade80; }
        .msg.err { color: #f87171; }

        .box { background: #121212; border: 1px solid #1f1f1f; border-radius: 8px; padding: 12px; margin-top: 12px; font-size: 0.85rem; color: #ccc; line-height: 1.5; }
        .box ol { padding-left: 18px; margin-top: 6px; }
        .box code { background: #1a1a1a; padding: 1px 5px; border-radius: 4px; font-size: 0.8rem; }
        #publish-box { display: none; }
        #publish-box.show { display: block; }

        .item { display: flex; gap: 10px; align-items: center; background: #121212; border: 1px solid #1f1f1f; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
        .item img { width: 80px; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; background: #1a1a1a; }
        .item .t { flex: 1; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .item .new { color: #4ade80; font-size: 0.7rem; display: block; }
        .item button { background: transparent; border: 1px solid #333; color: #f87171; border-radius: 6px; padding: 12px 14px; cursor: pointer; }
        .item button:hover { background: #1a1a1a; }
        .empty { font-size: 0.85rem; color: #666; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">DOLL18</a>
        <a href="index.html" style="color:#ccc;text-decoration:none;font-size:0.9rem;"><i class="fas fa-arrow-left"></i> Kembali</a>
    </header>

    <div class="container">
        <h1>Upload Video</h1>

        <form id="upload-form">
            <label for="title">Judul</label>
            <input type="text" id="title" placeholder="Judul video" maxlength="150" required>

            <label for="url">Link Video (embed)</label>
            <input type="url" id="url" placeholder="https://playmogo.com/e/xxxxxxxx" required>

            <label for="thumb">Gambar Thumbnail</label>
            <input type="file" id="thumb" accept="image/*" required>
            <img id="preview" class="preview" alt="Preview thumbnail">

            <button type="submit" class="btn"><i class="fas fa-plus"></i> Tambah ke Daftar</button>
            <div class="msg" id="msg"></div>
        </form>

        <div class="box" id="publish-box">
            <strong>Langkah publish ke GitHub:</strong>
            <ol>
                <li>Download <code>videos.json</code> terbaru lalu ganti file lama di repo.</li>
                <li>Download tiap thumbnail baru lalu taruh di folder <code>thumbs/</code> di repo.</li>
                <li>Commit. Web akan update otomatis dalam beberapa menit.</li>
            </ol>
            <button type="button" class="btn" id="dl-json"><i class="fas fa-download"></i> Download videos.json</button>
            <div id="dl-thumbs"></div>
        </div>

        <h2>Daftar video</h2>
        <div id="my-list"></div>
    </div>

    <script src="app.js"></script>
    <script>
        const form = document.getElementById('upload-form');
        const fileInput = document.getElementById('thumb');
        const preview = document.getElementById('preview');
        const msg = document.getElementById('msg');
        const publishBox = document.getElementById('publish-box');

        let working = [];   // salinan daftar video yang sedang diedit
        let pending = [];   // thumbnail baru yang belum di-upload ke GitHub: {path, blob}
        let newIds = new Set();
        let thumbBlob = null;
        let thumbUrl = null;

        function showMsg(text, ok) {
            msg.textContent = text;
            msg.className = 'msg ' + (ok ? 'ok' : 'err');
        }

        function slugify(s) {
            return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'video';
        }

        function downloadBlob(blob, filename) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        }

        // Kecilkan gambar jadi JPEG max 640px lebar
        function compressImage(file, maxWidth = 640) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objUrl = URL.createObjectURL(file);
                img.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error('gambar rusak')); };
                img.onload = () => {
                    const scale = Math.min(1, maxWidth / img.width);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(objUrl);
                    canvas.toBlob(b => b ? resolve(b) : reject(new Error('gagal')), 'image/jpeg', 0.85);
                };
                img.src = objUrl;
            });
        }

        fileInput.addEventListener('change', async () => {
            const file = fileInput.files[0];
            thumbBlob = null;
            preview.classList.remove('show');
            if (thumbUrl) { URL.revokeObjectURL(thumbUrl); thumbUrl = null; }
            if (!file) return;
            try {
                thumbBlob = await compressImage(file);
                thumbUrl = URL.createObjectURL(thumbBlob);
                preview.src = thumbUrl;
                preview.classList.add('show');
            } catch (e) {
                showMsg('Gambar tidak bisa dibaca. Coba file lain.', false);
            }
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            const title = document.getElementById('title').value.trim();
            const url = document.getElementById('url').value.trim();

            if (!title) return showMsg('Judul wajib diisi.', false);
            if (!isValidHttpUrl(url)) return showMsg('Link video tidak valid.', false);
            if (!thumbBlob) return showMsg('Pilih gambar thumbnail dulu.', false);

            const id = slugify(title) + '-' + Date.now().toString(36);
            const path = 'thumbs/' + id + '.jpg';

            working.push({ id, title, url, thumb: path, createdAt: new Date().toISOString() });
            pending.push({ path, blob: thumbBlob, previewUrl: thumbUrl });
            newIds.add(id);

            thumbUrl = null; // dipakai oleh daftar, jangan di-revoke
            thumbBlob = null;
            form.reset();
            preview.classList.remove('show');
            showMsg('Video ditambahkan. Download file di bawah lalu upload ke GitHub.', true);
            refresh();
        });

        document.getElementById('dl-json').addEventListener('click', () => {
            const sorted = [...working].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
            downloadBlob(new Blob([JSON.stringify(sorted, null, 2) + '\n'], { type: 'application/json' }), 'videos.json');
        });

        function renderDownloads() {
            const box = document.getElementById('dl-thumbs');
            box.innerHTML = '';
            pending.forEach(p => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'btn secondary';
                b.innerHTML = '<i class="fas fa-image"></i> ';
                b.append('Download ' + p.path.replace('thumbs/', ''));
                b.addEventListener('click', () => downloadBlob(p.blob, p.path.replace('thumbs/', '')));
                box.appendChild(b);
            });
            publishBox.classList.toggle('show', newIds.size > 0 || working.length !== original.length);
        }

        let original = [];

        function renderList() {
            const box = document.getElementById('my-list');
            box.innerHTML = '';
            const list = [...working].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));

            if (!list.length) {
                box.innerHTML = '<div class="empty">Belum ada video.</div>';
                return;
            }

            list.forEach(v => {
                const row = document.createElement('div');
                row.className = 'item';

                const img = document.createElement('img');
                const p = pending.find(x => x.path === v.thumb);
                img.src = p ? p.previewUrl : v.thumb;

                const t = document.createElement('div');
                t.className = 't';
                t.textContent = v.title;
                if (newIds.has(v.id)) {
                    const n = document.createElement('span');
                    n.className = 'new';
                    n.textContent = 'baru, belum dipublish';
                    t.appendChild(n);
                }

                const del = document.createElement('button');
                del.innerHTML = '<i class="fas fa-trash"></i>';
                del.title = 'Hapus dari daftar';
                del.addEventListener('click', () => {
                    if (!confirm('Hapus "' + v.title + '" dari daftar?\n(Berlaku setelah videos.json di-upload ke GitHub)')) return;
                    working = working.filter(x => x.id !== v.id);
                    pending = pending.filter(x => x.path !== v.thumb);
                    newIds.delete(v.id);
                    refresh();
                });

                row.append(img, t, del);
                box.appendChild(row);
            });
        }

        function refresh() {
            renderList();
            renderDownloads();
        }

        loadVideos().then(v => {
            if (v === null) {
                showMsg('Gagal memuat videos.json. Buka lewat server/GitHub Pages, bukan klik dua kali file HTML.', false);
                v = [];
            }
            working = v;
            original = [...v];
            refresh();
        });
    </script>
</body>
</html>
